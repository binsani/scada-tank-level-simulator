name: Basic validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP syntax and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml
      - name: Validate composer.json
        run: composer validate --no-check-publish
      - name: Check visitor context fail-closed contract
        run: php tests/Feature/DemoVisitorContextContractTest.php
      - name: Check visitor state key foundation
        run: php tests/Feature/DemoStateKeyTest.php
      - name: Check public demo route contract
        run: php tests/Feature/PublicDemoRoutesTest.php
      - name: Check visitor history and CLI isolation contracts
        run: php tests/Feature/DemoIsolationContractsTest.php
      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Laravel database-backed feature tests
        run: vendor/bin/phpunit --testsuite 'Laravel Feature'
      - name: Check PHP syntax
        run: |
          find app routes config database -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend assets
        run: npm run build
